[tool.poetry]
name = "parsing"
version = "0.1.0"
description = "Parsing service for storing standardized structure"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-document-layout = { path = "../vendors/deps-document-layout", develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
deps-tabular-layout = { path = "../vendors/deps-tabular-layout", develop = true }
deps-object-storage = { path = "../vendors/deps-object-storage", develop = true }

dependency-injector = "^4.48.0"
click = "^8.1.7"
fastapi = "^0.120"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
psycopg2-binary = "^2.9.9"
uvicorn = "^0.23.2"
azure-ai-formrecognizer = "^3.3.1"
azure-core = "^1.38.0"
amazon-textract-textractor = "^1.9.2"
SQLAlchemy = "1.3.12"
authlib = "^1.6.5"
aiohttp = "^3.13.3"
requests = "^2.32.4"
urllib3 = "^2.6.3"
openpyxl = "^3"
xlrd = "^2.0.2"
pandas = "^2.2.3"
chardet = "^5.2.0"
python-docx = "^1.1.2"
google-cloud-documentai = "^3.3.0"
google-auth = "^2.38.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.0"
olefile = "^0.47"
more-itertools = "^10.7.0"
pyasn1 = "^0.6.2"

[tool.poetry.group.dev.dependencies]
ipdb = "^0.13.9"
see = "^1.4.1"
mypy = "^1.6.1"
flake8 = "^6.1.0"
wemake-python-styleguide = "^0.18.0"
isort = "^5.12.0"
black = "^23.10.0"
pytest = "^7.4.2"
coverage = "^7.3.2"
factory-boy = "^3.3.0"
pytest-factoryboy = "^2.6.0"
pytest-mock = "^3.11.1"
pytest-unordered = "^0.5.2"
requests-mock = "^1.11.0"
bandit = "^1.7.5"
httpx = "^0.25.0"
jupyter = "^1.0.0"
pytest-lazy-fixture = "^0.6.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
datasource = ["datasource"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''

[tool.pytest.ini_options]
markers = [
    "document_layout_service",
    "azure_parsing",
    "deps_parsing",
    "document_layout",
    "page",
    "info",
    "parsing_info",
    "partial",
]
