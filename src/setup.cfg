[tool:pytest]
cache_dir = /tmp/test_cache/.pytest_cache

[flake8]
ignore =
    # Missing docstring in public module
    D100,
    # Missing docstring in public class
    D101,
    # Missing docstring in public function
    D103,
    # Missing docstring in public package
    D104,
    # Do not perform function calls in argument defaults.  The call is performed only once at function definition time.
    B008,
    # Class without a base class
    WPS306,
    # Found a line that starts with a dot
    WPS348,
    # Found too short name
    WPS111,
    # Missing docstring in __init__
    D107,
    # Missing docstring in public method
    D102,
    # Missing parameter(s) in Docstring
    DAR101,
    # Missing "Returns" in Docstring
    DAR201,
    # Found commented out code
    E800,
    # Found `f` string
    WPS305,
    # Line break before binary operator
    W503,
    # Found upper-case constant in a class
    WPS115,
    # Found subclassing a builtin
    WPS600,
    # Double quotes found but single quotes preferred
    Q000,
    # Found module with too many imports
    WPS201,
    # Found too many arguments
    WPS211,
    # Found local folder import
    WPS300,
    # Found complex default value
    WPS404,
    # Found too long ``try`` body length
    WPS229,
    # Found `__init__.py` module with logic
    WPS412,
    # Found wrong keyword: pass
    WPS420,
    # Found nested class:
    WPS431,
    # Found wrong variable name
    WPS110,
    # Missing docstring in public nested class
    D106,
    # Found string constant over-use
    WPS226,
    # Found a too complex `f` string
    WPS237,
    # Found line with high Jones Complexity: 16 > 14
    WPS221,
    # Found wrong function call
    WPS421,
    # Remove all docstring rules
    D,
    # Found shadowed class attribute
    WPS601,
    # Found using `@staticmethod`
    WPS602,
    # Found incorrect node inside `class` body
    WPS604,
    # Found wrong metadata variable: __all__
    WPS410,
    # Found direct magic attribute usage: __all__
    WPS609,
    # used; unable to detect undefined names
    F403,
    # Found vague import that may cause confusion: *
    WPS347,
    # Found block variables overlap: *
    WPS440,
    F405,
    # Found executable mismatch: file is executable but no shebang is present
    WPS453,
    # Found `%` string formatting
    WPS323,
    # exception name 'ParsingException' should be named with an Error suffix
    N818,
    #  Found walrus operator
    WPS332,
    #  Found too many imported names from a module
    WPS235,
    # I want my indentation
    RST301,
    # We allow 0.0
    WPS358

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

per-file-ignores =
# There are multiple `assert`s in tests, we allow them:
    src/tests/*.py: S101
    ./deps_parsing/entrypoint.py: WPS421, WPS433, WPS430, WPS212
    ./deps_parsing/settings.py: WPS202
    ./deps_parsing/containers.py: WPS202, WPS203
    ./deps_parsing/infrastructure/exceptions.py: WPS202
    ./deps_parsing/domain/interfaces/*: WPS428
    ./deps_parsing/infrastructure/repositories/document_layout/query_factory.py: WPS214
    ./deps_parsing/application/document_layout.py: WPS214
    ./deps_parsing/application/v2/document_layout.py: WPS214
    ./deps_parsing/infrastructure/tables/document_type.py: WPS432
    ./deps_parsing/infrastructure/parsing_services/engines/deps/types.py: WPS202
    ./*abstract*: WPS428
    ./*protocol*: WPS428
    ./deps_parsing/infrastructure/dl_parsing/page_based_service.py: WPS428
    ./deps_parsing/infrastructure/dl_parsing/v2/page_based_service.py: WPS428
    ./deps_parsing/extras/*: B024, B027, S105, WPS420, WPS604, WPS112, WPS615, WPS110, WPS430, WPS220, WPS331, WPS516, WPS437, WPS601, WPS326, WPS503, WPS338, WPS214, WPS608, P101, WPS433, WPS232, N805, WPS231
    ./deps_parsing/application/parsing_type.py: WPS450, N804, WPS117, B010, WPS441, WPS529
    ./deps_parsing/infrastructure/tl_parsing/excel/parser.py: WPS231, WPS352
    ./deps_parsing/infrastructure/tl_parsing/v2/excel/parser.py: WPS231, WPS352
    ./deps_parsing/infrastructure/tl_parsing/excel/line_based_detection/strategy.py: WPS504, E203, RST301, WPS337
    ./deps_parsing/infrastructure/dl_parsing/docx/parser/*: WPS437, WPS358, P101, WPS331, WPS450
    ./deps_parsing/domain/services/split_tables_detection/similarity_markers/index_continuation.py: WPS360, WPS116
    ./deps_parsing/domain/services/split_tables_detection/similarity_markers/text_between.py: WPS219
    ./deps_parsing/infrastructure/dl_parsing/google/parser/structured_response.py: E203, WPS219
    ./deps_parsing/infrastructure/dl_parsing/google/parser/text_spans.py: WPS219
    ./deps_parsing/infrastructure/dl_parsing/google/parser/key_value.py: WPS529
    ./deps_parsing/infrastructure/proxies/google/retry.py: WPS231, WPS232
    ./deps_parsing/infrastructure/dl_parsing/image_processing/config.py: E501
    ./deps_parsing/infrastructure/proxies/ai_fusion.py: N815

max-local-variables = 15
max-methods = 18
max-line-length = 120

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined, func-returns-value
warn_no_return = False

[mypy-requests.*]
ignore_missing_imports = True

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
