{{- if .Values.vault_settings.gcp_secret_manager }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-database-host/versions/latest" 
        fileName: "db-host"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-parsing-db-user/versions/latest" 
        fileName: "parsing-db-user"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-parsing-db-password/versions/latest" 
        fileName: "parsing-db-password"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-parsing-db/versions/latest" 
        fileName: "parsing-db"
  secretObjects:
    - secretName: {{ .Values.secrets.deps_parsing_migrator.secretName }}
      type: Opaque
      data:
      - objectName: "db-host"
        key: db-host
      - objectName: "parsing-db-user"
        key: parsing-db-user
      - objectName: "parsing-db-password"
        key: parsing-db-password
      - objectName: "parsing-db"
        key: parsing-db
{{- end }}
