secrets:
  deps_parsing_migrator:
    secretName: deps-parsing-migrator
  parsing_database:
    secretName: parsing-database
  database_ssl_secret:
    secretName: database-ssl-secret

helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    path: "/base/kubernetes-helm"
    pullPolicy: IfNotPresent
    tag: "0.1.1"
  resources: {}

registry: ""
env: ""

migrator:
  image:
    path: "/deps-dev-x01/deps-parsing-migrator"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  args: ''

migration_settings:
  DATABASE_PORT: '5432'
  DATABASE_DRIVER: psycopg2
  DATABASE_DIALECT: postgresql
  DATABASE_REQUIRE_SECURE_TRANSPORT: false
  DATABASE_SSLKEY_PATH: '/home/dbcerts/tls.key'
  DATABASE_SSLCERT_PATH: '/home/dbcerts/tls.crt'
  DATABASE_SSLROOTCERT_PATH: '/home/dbcerts/root.crt'

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

helm:
  enabled: false

csi:
  csi_default_name: deps-parsing-migrator
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
  serviceAccountName: 'deps-develop'

secret_project_id:
  id: ""

azure_kv_settings:
  keyvaultName: ""
  tenantId: ""
  userAssignedIdentityID: ""
  resourceGroup: ""
  subscriptionId: ""

vault_settings:
  enabled: false
  hashicorp_vault: false
  azure_key_vault: false
  gcp_secret_manager: false
  aws_secret_manager: false
  aws_secret_manager_region: ''

migrator_vault_enabled:
  env:
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: deps-parsing-migrator
        key: db-host
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: deps-parsing-migrator
        key: parsing-db-user
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: deps-parsing-migrator
        key: parsing-db-password
  - name: DATABASE_DB
    valueFrom:
      secretKeyRef:
        name: deps-parsing-migrator
        key: parsing-db

migrator_vault_disabled:
  env:
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: common-secret
        key: database-host
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: parsing-database
        key: user
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: parsing-database
        key: password
  - name: DATABASE_DB
    valueFrom:
      secretKeyRef:
        name: parsing-database
        key: database-db
