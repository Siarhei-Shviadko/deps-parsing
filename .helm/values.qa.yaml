parsing:
  image:
    path: "/deps-platform/deps-parsing"
  resources: {}

parsing_settings:
  ENV: qa
  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  INSTRUMENTATION_ENABLED: true

  S3_BUCKET_NAME: bucket_name
  S3_ENDPOINT_URL: https://s3.us-east-1.amazonaws.com

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

parsing_consumer:
  image:
    path: "/deps-platform/deps-parsing"

migrator:
  image:
    path: "/deps-platform/deps-parsing-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-qa'
  roleName: 'k8s-qa'
  vaultKubernetesMountPath: 'kubernetes-qa'

service_account:
  serviceAccountName: 'deps-qa'
