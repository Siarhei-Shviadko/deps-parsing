{{- if .Values.vault_settings.hashicorp_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: vault
  secretObjects:
  - data:
    - key: app-secret-key
      objectName: app-secret-key
    - key: keycloak-certs-endpoint
      objectName: keycloak-certs-endpoint
    - key: message-broker-driver
      objectName: message-broker-driver
    - key: message-broker-connection-string
      objectName: message-broker-connection-string
    - key: database-host
      objectName: database-host
    - key: database-db
      objectName: database-db
    - key: user
      objectName: user
    - key: password
      objectName: password
    - key: aws-access-key-id
      objectName: aws-access-key-id
    - key: aws-secret-access-key
      objectName: aws-secret-access-key
    - key: aws-region-name
      objectName: aws-region-name
    - key: gcp-docai-account-info
      objectName: gcp-docai-account-info
    - key: gcp-docai-idp-client-secret
      objectName: gcp-docai-idp-client-secret
    secretName: {{ .Values.secrets.deps_parsing.secretName }}
    type: Opaque
  parameters:
    roleName: "{{ .Values.csi.roleName }}"
    vaultAddress: "https://vault_host"
    vaultNamespace: "vault_namespace"
    vaultSkipTLSVerify: "true"
    #vaultCACertPath: ""
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    objects: |
      - objectName: "app-secret-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-parsing/app-secret-key"
        secretKey: "app-secret-key"
      - objectName: "keycloak-certs-endpoint"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "keycloak-certs-endpoint"
      - objectName: "message-broker-driver"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "message-broker-driver"
      - objectName: "message-broker-connection-string"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "message-broker-connection-string"
      - objectName: "database-host"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "database-host"
      - objectName: "database-db"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-parsing/parsing-database"
        secretKey: "database-db"
      - objectName: "user"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-parsing/parsing-database"
        secretKey: "user"
      - objectName: "password"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-parsing/parsing-database"
        secretKey: "password"
      - objectName: "aws-access-key-id"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-ocr"
        secretKey: "aws-access-key-id"
      - objectName: "aws-secret-access-key"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-ocr"
        secretKey: "aws-secret-access-key"
      - objectName: "aws-region-name"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-ocr"
        secretKey: "aws-region-name"
      - objectName: "gcp-docai-account-info"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-parsing/gcp-credentials"
        secretKey: "gcp-docai-account-info"
      - objectName: "gcp-docai-idp-client-secret"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-parsing/gcp-credentials"
        secretKey: "gcp-docai-idp-client-secret"
        
      

{{- end }}
